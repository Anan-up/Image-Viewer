<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片查看器</title>
<style>
  :root{
    --fg:#1a1a1a;
    --muted:#9a9a9a;
    --line:#f0f0f0;
    --hover:#f4f4f4;
    --active:#111;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#fff;color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}

  /* 顶部工具栏 */
  .toolbar{
    position:absolute;top:0;left:0;right:0;height:54px;z-index:20;
    display:flex;align-items:center;gap:4px;padding:0 14px;
    background:#fff;border-bottom:1px solid var(--line);
    transition:opacity .18s ease, transform .18s ease;
  }
  .group{display:flex;align-items:center;gap:2px;}
  .spacer{flex:1;}
  .ico{
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;color:var(--fg);transition:background .12s;
  }
  .ico:hover{background:var(--hover);}
  .ico:active{background:#ececec;}
  .ico svg{width:20px;height:20px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 8px;}

  .info{
    display:flex;flex-direction:column;align-items:center;line-height:1.3;
    max-width:42vw;overflow:hidden;
  }
  .info .name{font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;}
  .info .meta{font-size:11px;color:var(--muted);}

  .pct{
    min-width:54px;height:38px;padding:0 10px;border-radius:8px;font-size:13px;
    display:flex;align-items:center;justify-content:center;color:var(--fg);
    font-variant-numeric:tabular-nums;transition:background .12s;
  }
  .pct:hover{background:var(--hover);}

  /* 视口 */
  .viewport{
    position:absolute;inset:54px 0 0 0;overflow:hidden;background:#fff;
    cursor:grab;touch-action:none;user-select:none;
    transition:top .18s ease;
  }
  .viewport.grabbing{cursor:grabbing;}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .stage img{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    max-width:none;max-height:none;pointer-events:none;-webkit-user-drag:none;
    -webkit-user-select:none;user-select:none;
  }

  /* 缩略图条 */
  .thumbs{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    display:none;gap:8px;padding:10px 14px;background:#fff;
    border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
    transition:opacity .18s ease, transform .18s ease;
  }
  .thumbs.show{display:flex;}
  .thumb{
    position:relative;flex:0 0 auto;height:54px;width:54px;border-radius:6px;
    overflow:hidden;background:#fafafa;border:2px solid transparent;cursor:pointer;
    transition:border-color .12s;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .thumb.active{border-color:var(--active);}
  .thumb .del{
    position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
    background:#fff;border:1px solid var(--line);color:#888;font-size:12px;line-height:16px;
    display:none;align-items:center;justify-content:center;
  }
  .thumb:hover .del{display:flex;}
  .thumb .del:hover{background:#f4f4f4;color:#111;}

  /* 空状态 */
  .empty{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;color:var(--muted);
    background:#fff;
  }
  .empty .title{font-size:17px;color:var(--fg);font-weight:500;}
  .empty .sub{font-size:13px;}
  .open-btn{
    margin-top:6px;padding:10px 20px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;color:var(--fg);transition:background .12s,border-color .12s;
  }
  .open-btn:hover{background:var(--hover);border-color:#e2e2e2;}

  /* 拖拽遮罩 */
  .drop-overlay{
    position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(255,255,255,.85);border:3px dashed #d8d8d8;color:#888;font-size:16px;
  }
  .drop-overlay.show{display:flex;}

  .hidden{display:none !important;}

  /* 全屏按钮图标切换 */
  .fs-exit{display:none;}
  body.fullscreen .fs-enter{display:none;}
  body.fullscreen .fs-exit{display:block;}

  /* 放大沉浸：自动隐藏上下工具栏，鼠标移到边缘临时唤出 */
  body.immersive .viewport{top:0;}
  body.immersive .toolbar{opacity:0;transform:translateY(-100%);pointer-events:none;}
  body.immersive .thumbs{opacity:0;transform:translateY(100%);pointer-events:none;}
  body.immersive.reveal .toolbar{opacity:1;transform:translateY(0);pointer-events:auto;}
  body.immersive.reveal .thumbs{opacity:1;transform:translateY(0);pointer-events:auto;}
</style>
</head>
<body>

  <!-- 空状态 -->
  <div class="empty" id="empty">
    <div class="title">拖拽图片到此处</div>
    <div class="sub">支持 JPG · PNG · GIF · WebP · SVG · BMP · ICO · AVIF 等格式</div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="open-btn" id="openEmpty">选择图片</button>
      <button class="open-btn" id="openFolderEmpty">选择文件夹</button>
    </div>
  </div>

  <!-- 顶部工具栏 -->
  <div class="toolbar hidden" id="toolbar">
    <div class="group">
      <button class="ico" data-act="open" title="打开图片文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <button class="ico" data-act="open-folder" title="打开整个文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></button>
      <button class="ico" data-act="prev" title="上一张（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ico" data-act="next" title="下一张（→ / 空格）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="ico" data-act="zoom-out" title="缩小（-）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
      <div class="pct" id="pct" data-act="actual" title="实际大小（1）">100%</div>
      <button class="ico" data-act="zoom-in" title="放大（+）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
      <button class="ico" data-act="fit" title="适应窗口（0 / f）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg></button>
      <button class="ico" data-act="rotate" title="旋转 90°（r）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg></button>
    </div>
    <div class="sep"></div>
    <button class="ico" data-act="fullscreen" title="全屏（按 Esc 退出）">
      <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3a2 2 0 0 1 2 2v3M21 8h-3a2 2 0 0 1-2 2v3M3 16h3a2 2 0 0 1 2-2v-3M21 16h-3a2 2 0 0 1-2-2v-3"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="info">
      <div class="name" id="fname">—</div>
      <div class="meta" id="fmeta">0 / 0</div>
    </div>
    <div class="spacer"></div>
  </div>

  <!-- 视口 -->
  <div class="viewport hidden" id="viewport">
    <div class="stage" id="stage"><img id="img" alt=""></div>
  </div>

  <!-- 缩略图条 -->
  <div class="thumbs" id="thumbs"></div>

  <!-- 拖拽遮罩 -->
  <div class="drop-overlay" id="dropOverlay">松开以打开图片</div>

  <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.ico,.avif,.tif,.tiff" multiple class="hidden">
  <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden">

<script>
(function(){
  "use strict";

  const MIN_SCALE = 0.02, MAX_SCALE = 60;
  const state = { scale:1, tx:0, ty:0, rot:0, index:0, fitScale:1 };
  let items = []; // {file, url, name}

  const $ = (id)=>document.getElementById(id);
  const empty = $('empty'), toolbar = $('toolbar'), viewport = $('viewport');
  const stage = $('stage'), img = $('img'), thumbs = $('thumbs');
  const fname = $('fname'), fmeta = $('fmeta'), pct = $('pct');
  const fileInput = $('fileInput'), folderInput = $('folderInput'), dropOverlay = $('dropOverlay');

  /* ---------- 变换应用 ---------- */
  function apply(){
    stage.style.transform =
      `translate(${state.tx}px, ${state.ty}px) scale(${state.scale}) rotate(${state.rot}deg)`;
    pct.textContent = Math.round(state.scale * 100) + '%';
    updateChrome();
  }

  // 放大到图片溢出视口时隐藏上下工具栏，缩小回适应即恢复
  function updateChrome(){
    const immersive = state.scale > state.fitScale + 1e-3;
    document.body.classList.toggle('immersive', immersive);
    if(!immersive) document.body.classList.remove('reveal');
  }

  function clampScale(s){ return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }

  // 以指针(mx,my)为屏幕中心缩放：T' = m - k(m - T)
  function zoomAt(mx, my, factor){
    const newScale = clampScale(state.scale * factor);
    const k = newScale / state.scale;
    state.scale = newScale;
    state.tx = mx - k * (mx - state.tx);
    state.ty = my - k * (my - state.ty);
    apply();
  }
  function zoomCenter(factor){
    zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, factor);
  }

  function fit(){
    if(!items.length) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if(!iw || !ih) return;
    // 旋转 90/270 时宽高互换
    const rotated = ((state.rot % 180) + 360) % 180 === 90;
    const w = rotated ? ih : iw, h = rotated ? iw : ih;
    const s = Math.min(vw / w, vh / h);
    state.fitScale = s;
    state.scale = s;
    state.tx = vw / 2;
    state.ty = vh / 2;
    apply();
  }
  function actual(){
    state.scale = 1;
    state.tx = viewport.clientWidth / 2;
    state.ty = viewport.clientHeight / 2;
    apply();
  }
  function rotate(){ state.rot += 90; apply(); }
  function toggleFullscreen(){
    if(document.fullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }
  document.addEventListener('fullscreenchange', ()=>{
    document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
  });

  /* ---------- 渲染 ---------- */
  function renderCurrent(){
    const it = items[state.index];
    if(!it) return;
    img.onload = ()=>{ fit(); updateInfo(); };
    img.src = it.url;
    fname.textContent = it.path;
    updateThumbsActive();
  }
  function updateInfo(){
    const cur = items[state.index];
    fname.textContent = cur ? cur.path : '—';
    fname.title = cur ? cur.path : '';
    fmeta.textContent = (state.index + 1) + ' / ' + items.length;
    pct.textContent = Math.round(state.scale * 100) + '%';
  }
  function renderThumbs(){
    thumbs.innerHTML = '';
    items.forEach((it, i)=>{
      const t = document.createElement('div');
      t.className = 'thumb' + (i === state.index ? ' active' : '');
      t.dataset.i = i;
      const im = document.createElement('img');
      im.src = it.url; im.alt = it.path;
      const del = document.createElement('div');
      del.className = 'del'; del.textContent = '×'; del.dataset.del = i;
      del.title = '移除';
      t.appendChild(im); t.appendChild(del);
      thumbs.appendChild(t);
    });
    thumbs.scrollLeft = thumbs.scrollWidth;
  }
  function updateThumbsActive(){
    [...thumbs.children].forEach((c, i)=>{
      c.classList.toggle('active', i === state.index);
    });
    const active = thumbs.children[state.index];
    if(active) active.scrollIntoView({inline:'nearest', block:'nearest'});
  }

  function select(i){
    if(!items.length) return;
    state.index = (i + items.length) % items.length;
    state.rot = 0;
    renderCurrent();
    updateInfo();
  }

  /* ---------- 文件加载（完全本地，不上传） ---------- */
  function addFiles(fileList){
    const files = [...fileList].filter(f=>{
      if(f.type && f.type.startsWith('image/')) return true;
      return /\.(jpe?g|png|gif|webp|bmp|svg|ico|avif|tif|tiff)$/i.test(f.name);
    }).sort((a,b)=>
      (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, 'zh')
    );
    if(!files.length) return;
    const wasEmpty = items.length === 0;
    files.forEach(f => items.push({
      file:f, url:URL.createObjectURL(f), name:f.name, path:f.webkitRelativePath || f.name
    }));
    if(wasEmpty){
      state.index = 0;
      showViewer();
      renderThumbs();
      renderCurrent();
    } else {
      renderThumbs();
      updateInfo();
    }
  }
  function removeCurrent(){
    const it = items[state.index];
    if(it) URL.revokeObjectURL(it.url);
    items.splice(state.index, 1);
    if(items.length === 0){ showEmpty(); return; }
    state.index = Math.min(state.index, items.length - 1);
    state.rot = 0;
    renderThumbs();
    renderCurrent();
    updateInfo();
  }
  function clearAll(){
    items.forEach(it => URL.revokeObjectURL(it.url));
    items = [];
    showEmpty();
  }

  function showViewer(){
    empty.classList.add('hidden');
    toolbar.classList.remove('hidden');
    viewport.classList.remove('hidden');
    thumbs.classList.toggle('show', items.length > 1);
  }
  function showEmpty(){
    empty.classList.remove('hidden');
    toolbar.classList.add('hidden');
    viewport.classList.add('hidden');
    thumbs.classList.remove('show');
    img.removeAttribute('src');
  }

  /* ---------- 交互：拖拽平移 ---------- */
  let dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
  viewport.addEventListener('pointerdown', (e)=>{
    if(e.button !== 0) return;
    dragging = true; sx = e.clientX; sy = e.clientY; stx = state.tx; sty = state.ty;
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('grabbing');
  });
  viewport.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    state.tx = stx + (e.clientX - sx);
    state.ty = sty + (e.clientY - sy);
    apply();
  });
  function endDrag(){ dragging = false; viewport.classList.remove('grabbing'); }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  /* ---------- 滚轮缩放（以指针为中心） ---------- */
  viewport.addEventListener('wheel', (e)=>{
    if(!items.length) return;
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoomAt(e.clientX - r.left, e.clientY - r.top, factor);
  }, { passive:false });

  /* ---------- 双击：适应 / 实际大小 切换 ---------- */
  viewport.addEventListener('dblclick', ()=>{
    if(!items.length) return;
    if(Math.abs(state.scale - 1) < 0.01) fit(); else actual();
  });

  /* ---------- 工具栏事件 ---------- */
  toolbar.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    switch(b.dataset.act){
      case 'open':   fileInput.click(); break;
      case 'open-folder': folderInput.click(); break;
      case 'prev':   select(state.index - 1); break;
      case 'next':   select(state.index + 1); break;
      case 'zoom-in':   zoomCenter(1.3); break;
      case 'zoom-out':  zoomCenter(1/1.3); break;
      case 'fit':    fit(); break;
      case 'actual': actual(); break;
      case 'rotate': rotate(); break;
      case 'fullscreen': toggleFullscreen(); break;
    }
  });
  $('openEmpty').addEventListener('click', ()=>fileInput.click());
  $('openFolderEmpty').addEventListener('click', ()=>folderInput.click());

  /* ---------- 缩略图事件 ---------- */
  thumbs.addEventListener('click', (e)=>{
    const del = e.target.closest('[data-del]');
    if(del){ e.stopPropagation(); state.index = +del.dataset.del; removeCurrent(); return; }
    const t = e.target.closest('.thumb');
    if(t) select(+t.dataset.i);
  });

  /* ---------- 文件选择 ---------- */
  fileInput.addEventListener('change', (e)=>{ addFiles(e.target.files); fileInput.value = ''; });
  folderInput.addEventListener('change', (e)=>{ addFiles(e.target.files); folderInput.value = ''; });

  /* ---------- 拖拽到窗口 ---------- */
  let dragDepth = 0;
  window.addEventListener('dragenter', (e)=>{ e.preventDefault(); dragDepth++; dropOverlay.classList.add('show'); });
  window.addEventListener('dragover', (e)=>{ e.preventDefault(); });
  window.addEventListener('dragleave', (e)=>{ e.preventDefault(); dragDepth--; if(dragDepth<=0){ dropOverlay.classList.remove('show'); dragDepth=0; } });
  window.addEventListener('drop', (e)=>{
    e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove('show');
    if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* ---------- 沉浸模式：鼠标移到边缘临时唤出工具栏 ---------- */
  window.addEventListener('mousemove', (e)=>{
    if(!document.body.classList.contains('immersive')){
      document.body.classList.remove('reveal');
      return;
    }
    const EDGE = 44;
    if(e.clientY < EDGE || e.clientY > window.innerHeight - EDGE){
      document.body.classList.add('reveal');
    } else {
      document.body.classList.remove('reveal');
    }
  });

  /* ---------- 键盘快捷键 ---------- */
  window.addEventListener('keydown', (e)=>{
    if(!items.length) return;
    if(e.target === fileInput) return;
    switch(e.key){
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); select(state.index + 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); select(state.index - 1); break;
      case '+': case '=': zoomCenter(1.3); break;
      case '-': case '_': zoomCenter(1/1.3); break;
      case '0': case 'f': case 'F': fit(); break;
      case '1': actual(); break;
      case 'r': case 'R': rotate(); break;
      case 'Delete': case 'Backspace': removeCurrent(); break;
      case 'Escape':
        if(document.fullscreenElement){ document.exitFullscreen(); break; }
        clearAll();
        break;
    }
  });

  /* 窗口尺寸变化时不强制重置视图，保持用户自由缩放状态 */
})();
</script>
</body>
</html>
